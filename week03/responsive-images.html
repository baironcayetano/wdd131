<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Bairon Cayetano">
    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals | Responsive Images">
    <link rel="stylesheet" href="./styles/responsive-images.css">
    <title>Responsive Images</title>
</head>
<body>
    <header>Header Content</header>
    <main>
        <div class="hero">
            <picture>
                <source media="(min-width:1000px )" srcset="./images/hero-large.webp">
                <source media="(min-width: 500px)" srcset="./images/hero-medium.webp">
                <img src="./images/hero-small.webp" alt="Tegucigalpa Honduras, Temple." width="500" height="250">
            </picture>
        </div>
    </main>
    <footer>Footer Content</footer>
</body>
</html>
