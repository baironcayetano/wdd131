<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Bairon Cayetano">
    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals | Country Page">

    <!-- CSS--->
    <link rel="stylesheet" href="./styles/place.css">
    <link rel="stylesheet" href="./styles/place-large.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">

    <script src="./scripts/weather.js" defer></script>

                <source media="(min-width: 500px)" srcset="./images/madagascar-hero-medium.webp">
                <img src="./images/madagascar-hero-small.webp" alt="A lemur in madagascar" width="500" height="250">
            </picture>
        </div>
        <div class="data"></div>
        <div class="weather"></div>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> Bairon Cayetano | Honduras</p>
